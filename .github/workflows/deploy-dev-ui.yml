name: deploy-ui-dev

on:
  push:
    branches:
      - develop
    paths:
      - "drivedesk-crm-ui/**"
      - ".github/workflows/deploy-dev-ui.yml"

jobs:
  deploy-ui:
    name: SSH and Deploy to Dev VM
    runs-on: ubuntu-latest

    env:
      UI_IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_KEY }}

      - name: SSH and Deploy to Dev VM
        run: |
          TAG=${{ github.sha }}
          echo "🔑 Connecting to VM and deploying UI with tag: $TAG"

          ssh -o StrictHostKeyChecking=no vinoothiniddi@${{ secrets.DEV_VM_IP }} << EOF
            set -e

            # Ensure project directory is ready
            if [ ! -d "~/drivedesk-crm-ui" ]; then
              echo "📁 Cloning UI repo..."
              git clone https://github.com/YOUR_GITHUB_USERNAME/drivedesk-crm-ui.git ~/drivedesk-crm-ui
            fi

            cd ~/drivedesk-crm-ui

            # Ensure latest code is present
            git pull origin develop

            # Ensure template file exists
            if [ ! -f docker-compose-dev.template.yml ]; then
              echo "❌ Missing template: docker-compose-dev.template.yml"
              exit 1
            fi

            echo "🛠️ Rendering docker-compose-dev.yml with tag: $TAG"
            UI_IMAGE_TAG=$TAG envsubst < docker-compose-dev.template.yml > docker-compose-dev.yml

            echo "📦 Pulling Docker image"
            docker-compose -f docker-compose-dev.yml pull

            echo "🧹 Stopping old container"
            docker-compose -f docker-compose-dev.yml down

            echo "🚀 Starting new container"
            docker-compose -f docker-compose-dev.yml up -d

            echo "✅ UI Deployment complete"
          EOF


name: deploy-ui-dev

on:
  push:
    branches:
      - develop
    paths:
      - "drivedesk-crm-ui/**"
      - ".github/workflows/deploy-dev-ui.yml"

jobs:
  deploy-ui:
    name: SSH and Deploy to Dev VM
    runs-on: ubuntu-latest

    env:
      UI_IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_KEY }}

      - name: SSH into VM and Deploy
        run: |
          echo "🔧 Connecting to VM and starting UI deployment..."

          ssh -o StrictHostKeyChecking=no vinoothiniddi@${{ secrets.GCP_VM_IP }} << EOF
            set -e
            cd ~/drivedesk-crm-ui

            echo "🔧 Exporting UI_IMAGE_TAG"
            export UI_IMAGE_TAG="${{ github.sha }}"

            echo "📄 Rendering docker-compose-dev.yml from template"
            envsubst < docker-compose-dev.template.yml > docker-compose-dev.yml

            echo "📦 Pulling UI image"
            docker-compose -f docker-compose-dev.yml pull

            echo "🧹 Stopping old containers"
            docker-compose -f docker-compose-dev.yml down

            echo "🚀 Starting updated UI container"
            docker-compose -f docker-compose-dev.yml up -d

            echo "✅ Deployment finished"
          EOF


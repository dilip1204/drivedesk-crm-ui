name: deploy-ui-dev

on:
  push:
    branches:
      - develop
jobs:
  deploy-ui:
    name: SSH and Deploy to Dev VM
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: sage-buttress-455713-h4
      REGION: asia-south1
      REPO_NAME: drivedesk-crm-ui
      IMAGE_NAME: crm-ui
      IMAGE_TAG: ${{ github.sha }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Authenticate to Google Cloud
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

    - name: Build and Push UI Docker image
      run: |
        docker build -t $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$IMAGE_TAG .
        docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:$IMAGE_TAG

    - name: SSH and Deploy to Dev VM
      run: |
        TAG=${{ github.sha }}
        echo "🔐 Connecting to Dev VM and deploying UI with tag: $TAG"

        ssh -o StrictHostKeyChecking=no vinoothiniddi@${{ secrets.DEV_VM_IP }} << EOF
          set -e

          cd ~

          if [ ! -d "drivedesk-crm-ui/.git" ]; then
            echo "📁 drivedesk-crm-ui not a Git repo. Cloning..."
            rm -rf drivedesk-crm-ui
            git clone https://github.com/dilip1204/drivedesk-crm-ui.git
          fi

          cd drivedesk-crm-ui
          git reset --hard
          git pull origin develop

          echo "🛠 Rendering docker-compose-dev.yml"
          UI_IMAGE_TAG=$TAG envsubst < docker-compose-dev.template.yml > docker-compose-dev.yml

          echo "📦 Pulling Docker image"
          docker-compose -f docker-compose-dev.yml pull

          echo "🧹 Stopping old container"
          docker-compose -f docker-compose-dev.yml down

          echo "🚀 Starting new container"
          docker-compose -f docker-compose-dev.yml up -d

          echo "✅ UI deployment completed"
        EOF
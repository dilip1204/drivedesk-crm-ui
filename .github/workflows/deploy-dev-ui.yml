name: Deploy UI to Dev VM

on:
  push:
    branches:
      - develop

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      UI_IMAGE_TAG: asia-south1-docker.pkg.dev/sage-buttress-455713-h4/drivedesk-crm-ui/crm-ui:${{ github.sha }}

    steps:
    - name: Checkout UI repo
      uses: actions/checkout@v3

    - name: Authenticate with GCP
      uses: google-github-actions/auth@v1
      with:
        credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

    - name: Configure Docker for Artifact Registry
      run: gcloud auth configure-docker asia-south1-docker.pkg.dev

    - name: Build and Push UI Docker Image
      run: |
        docker build -t $UI_IMAGE_TAG .
        docker push $UI_IMAGE_TAG

    - name: SSH into Dev VM and deploy using docker-compose
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.GCP_VM_IP }}
        username: ${{ secrets.GCP_VM_USER }}
        key: ${{ secrets.GCP_SSH_KEY }}
        envs: UI_IMAGE_TAG
        script: |
          cd ~/drivedesk-crm-ui || {
            echo "📁 Repo not found. Cloning..."
            git clone https://github.com/dilip1204/drivedesk-crm-ui.git
            cd drivedesk-crm-ui
          }

          echo "🔄 Pulling latest code..."
          git pull origin develop

          echo "⚙️ Rendering docker-compose-dev.yml"
          envsubst < docker-compose-dev.template.yml > docker-compose-dev.yml

          echo "📦 Pulling image"
          docker-compose -f docker-compose-dev.yml pull

          echo "🧹 Stopping old container"
          docker-compose -f docker-compose-dev.yml down

          echo "🚀 Starting updated container"
          docker-compose -f docker-compose-dev.yml up -d --remove-orphans

          echo "✅ UI Dev Deployment complete"


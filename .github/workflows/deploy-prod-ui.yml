name: Deploy UI to Hetzner (Prod)

on:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Deploy UI on Hetzner VM
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.HETZNER_HOST }} << 'EOF'
          set -e
          cd /srv/drivedesk-ui
          if [ ! -d .git ]; then
            git clone -b release https://github.com/dilip1204/drivedesk-crm-ui.git .
          else
            git fetch origin release
            git reset --hard origin/release
          fi
          docker compose -f docker-compose-prod.yml down
          docker compose -f docker-compose-prod.yml up -d --build
          EOF

name: Deploy Prod UI

on:
  workflow_dispatch:
  push:
    branches:
      - release

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure Docker to use gcloud as a credential helper
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev
      - name: Log in to Google Artifact Registry
        run: echo "${{ secrets.GCP_CREDENTIALS_PROD }}" | docker login -u _json_key --password-stdin https://asia-south1-docker.pkg.dev


      - name: Build & Push Prod UI Image
        run: |
          docker build \
            --build-arg REACT_APP_BASE_API_URL=/api \
            -t asia-south1-docker.pkg.dev/sage-buttress-455713-h4/drivedesk-crm-ui/crm-ui:prod \
            .

          docker push asia-south1-docker.pkg.dev/sage-buttress-455713-h4/drivedesk-crm-ui/crm-ui:prod

      - name: SSH into Prod VM and deploy UI
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.GCP_VM_IP_PROD }}
          username: ${{ secrets.GCP_VM_USER_PROD }}
          key: ${{ secrets.GCP_SSH_KEY_PROD }}
          script: |
            cd ~/drivedesk-crm-ui

            # Generate prod docker-compose file from template
            API_HOST=drivedesk-prod-api:8000 \
            UI_IMAGE_TAG=asia-south1-docker.pkg.dev/sage-buttress-455713-h4/drivedesk-crm-ui/crm-ui:prod \
            envsubst < docker-compose-prod.template.yml > docker-compose-prod.yml

            docker-compose -f docker-compose-prod.yml pull
            docker-compose -f docker-compose-prod.yml down
            docker-compose -f docker-compose-prod.yml up -d

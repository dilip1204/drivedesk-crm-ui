name: deploy-ui-dev

on:
  push:
    branches:
      - develop
    paths:
      - "drivedesk-crm-ui/**"
      - ".github/workflows/deploy-dev-ui.yml"

jobs:
  deploy-ui:
    name: SSH and Deploy to Dev VM
    runs-on: ubuntu-latest

    env:
      UI_IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.GCP_SSH_KEY }}

      - name: SSH into VM and Deploy
        run: |
          echo "🔧 Connecting to VM and starting UI deployment..."

          ssh -o StrictHostKeyChecking=no vinoothiniddi@${{ secrets.GCP_VM_IP }} << 'EOF'
            set -e
            echo "📁 Switching to project directory"
            cd ~/drivedesk-crm-ui

            echo "🔁 Substituting env vars into docker-compose-dev.yml"
            export UI_IMAGE_TAG='${{ github.sha }}'
            envsubst < docker-compose-dev.template.yml > docker-compose-dev.yml

            echo "📦 Pulling latest UI image: crm-ui:$UI_IMAGE_TAG"
            docker-compose -f docker-compose-dev.yml pull

            echo "🧹 Stopping previous containers"
            docker-compose -f docker-compose-dev.yml down

            echo "🚀 Starting new containers"
            docker-compose -f docker-compose-dev.yml up -d

            echo "✅ UI deployed with tag $UI_IMAGE_TAG"
          EOF

name: Deploy React UI to Dev (Safe YAML - No Clone)

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE=asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/drivedesk-crm-ui/crm-ui:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: SSH and Deploy UI Container Without Cloning
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            mkdir -p ~/drivedesk-crm-ui
            cd ~/drivedesk-crm-ui

            echo "GITHUB_SHA=${{ github.sha }}" > .env.dev

            echo "version: \"3\"" > docker-compose-dev.template.yml
            echo "services:" >> docker-compose-dev.template.yml
            echo "  drivedesk-dev-ui:" >> docker-compose-dev.template.yml
            echo "    image: asia-south1-docker.pkg.dev/sage-buttress-455713-h4/drivedesk-crm-ui/crm-ui:\${GITHUB_SHA}" >> docker-compose-dev.template.yml
            echo "    container_name: drivedesk-dev-ui" >> docker-compose-dev.template.yml
            echo "    restart: unless-stopped" >> docker-compose-dev.template.yml
            echo "    ports:" >> docker-compose-dev.template.yml
            echo "      - \"3000:80\"" >> docker-compose-dev.template.yml

            # Ensure shared network exists
            docker network create drivedesk-network || true

            # Launch the UI container
            docker-compose -f docker-compose-dev.template.yml --env-file .env.dev up -d drivedesk-dev-ui

            # Attach both UI and API to the same network
            docker network connect drivedesk-network drivedesk-dev-ui || true
            docker network connect drivedesk-network drivedesk-dev-api || true

name: Deploy React UI to Dev

on:
  push:
    branches:
      - develop

jobs:
  deploy-ui-dev:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Set UI Image Tag
        run: echo "UI_IMAGE_TAG=asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/drivedesk-crm-ui/drivedesk-dev-ui:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build and Push UI Docker Image
        run: |
          docker build -t $UI_IMAGE_TAG .
          docker push $UI_IMAGE_TAG

      - name: Generate docker-compose-dev.yml from template
        run: |
          cp docker-compose-dev.template.yml docker-compose-dev.yml
          sed -i "s|{{UI_IMAGE_TAG}}|$UI_IMAGE_TAG|g" docker-compose-dev.yml

      - name: SSH and Deploy to Dev VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            cd ~/drivedesk-crm-ui
             docker-compose -f docker-compose-dev.template.yml pull
             docker-compose -f docker-compose-dev.template.yml down
             docker-compose -f docker-compose-dev.template.yml up -d

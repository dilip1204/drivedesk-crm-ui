name: Deploy Prod UI

on:
  workflow_dispatch:

  push:
    branches:
      - release
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS_PROD }}

      - name: Configure Docker to use gcloud as a credential helper
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Log in to Google Artifact Registry
        run: echo "${{ secrets.GCP_CREDENTIALS_PROD }}" | docker login -u _json_key --password-stdin https://asia-south1-docker.pkg.dev


      - name: Build & Push Prod UI Image
        run: |
          docker build \
            --build-arg REACT_APP_BASE_API_URL=/api \
            -t asia-south1-docker.pkg.dev/sage-buttress-455713-h4/drivedesk-crm-ui/crm-ui:prod \
            .

          docker push asia-south1-docker.pkg.dev/sage-buttress-455713-h4/drivedesk-crm-ui/crm-ui:prod

      - name: SSH into Prod VM and deploy UI using docker-compose
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          envs: UI_IMAGE_TAG
          script: |
            cd ~/drivedesk-crm-ui || {
              echo "Repo not found. Cloning..."
              git clone https://github.com/your-org/drivedesk-crm-ui.git
              cd drivedesk-crm-ui
            }
            git pull origin release

            echo "Generating docker-compose-prod.yml..."
            envsubst < docker-compose-prod.template.yml > docker-compose-prod.yml

            echo "Restarting UI container..."
            docker-compose -f docker-compose-prod.yml pull
            docker-compose -f docker-compose-prod.yml down
            docker-compose -f docker-compose-prod.yml up -d --remove-orphans

            echo "✅ UI deployed to production!"


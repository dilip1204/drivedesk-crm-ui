name: Deploy React UI to Dev

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev

      - name: Build and Push Docker Image
        run: |
          IMAGE=asia-south1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/drivedesk-crm-ui/crm-ui:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: SSH and Deploy to Dev VM
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.GCP_VM_IP }}
          username: ${{ secrets.GCP_VM_USER }}
          key: ${{ secrets.GCP_SSH_KEY }}
          script: |
            export GITHUB_SHA=${{ github.sha }}
            cd ~/drivedesk-crm-ui
            echo "GITHUB_SHA=${GITHUB_SHA}" > .env.dev
            docker-compose -f docker-compose-dev.template.yml --env-file .env.dev up -d crm-ui